name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          curl -fL -o www/stockfish.js https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js
          ls -la www
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Chess Coach" com.chesscoach.standalone --web-dir www
          npx cap add android
          npx cap sync android
      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          convert icon.png -resize 1024x1024 assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          convert -size 1024x1024 xc:'#2f7d4f' assets/icon-background.png
          npx -y @capacitor/assets@3 generate --android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Coach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
