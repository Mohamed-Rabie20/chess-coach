name: Build APK
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Stockfish 19 version (lite = small and fast, full = strongest but ~94MB)"
        type: choice
        default: lite
        options:
          - lite
          - full
  push:
    paths:
      - index.html
      - css/**
      - js/**
      - slice.csv
      - icon.png
      - sounds/**
      - "*.mp3"
      - .github/workflows/**
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-capacitor6-v1
      - name: Prepare web files
        run: |
          mkdir -p www/engine
          cp index.html www/index.html
          if [ -d css ]; then cp -r css www/css; fi
          if [ -d js ]; then cp -r js www/js; fi
          if [ -f slice.csv ]; then cp slice.csv www/slice.csv; fi
          mkdir -p www/sounds
          if [ -d sounds ]; then cp -r sounds/. www/sounds/; fi
          for f in *.mp3; do if [ -f "$f" ]; then cp "$f" www/sounds/; fi; done
          curl -fL -o www/stockfish.js https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js
          ls -la www
      - name: Stockfish 19 (WASM, single-thread)
        continue-on-error: true
        env:
          ENGINE_CHOICE: ${{ github.event.inputs.engine }}
        run: |
          B=https://github.com/nmrugg/stockfish.js/releases/download/v19.0.1
          if [ "$ENGINE_CHOICE" = "full" ]; then N=stockfish-19-single; L="Stockfish 19 (WASM, NNUE, full)"; else N=stockfish-19-lite-single; L="Stockfish 19 (WASM, NNUE, lite)"; fi
          echo "Selected: $N"
          if curl -fL --retry 3 -o www/engine/$N.js $B/$N.js && curl -fL --retry 3 -o www/engine/$N.wasm $B/$N.wasm; then
            printf 'window.SFNEW={file:"engine/%s.js",name:"%s"};\n' "$N" "$L" > www/engine/config.js
            ls -la www/engine
            echo "USING ENGINE: $L"
          else
            rm -f www/engine/$N.js www/engine/$N.wasm
            echo "Stockfish 19 download failed - trying the npm package instead"
          fi
      - name: Fallback engine from npm (only if Stockfish 19 download failed)
        continue-on-error: true
        run: |
          if [ -f www/engine/config.js ]; then echo "Stockfish 19 already installed"; exit 0; fi
          mkdir -p /tmp/sf && cd /tmp/sf
          npm init -y >/dev/null 2>&1
          npm install stockfish --no-audit --no-fund
          PKG=/tmp/sf/node_modules/stockfish
          echo "--- files in the package"
          find $PKG -type f \( -name '*.js' -o -name '*.wasm' \) -printf '%s %P\n' | sort -k2
          JS=""
          for pat in '*lite*single*.js' '*single*.js'; do
            for f in $(find $PKG -type f -name "$pat" | sort); do
              w="${f%.js}.wasm"
              if [ -f "$w" ] && [ "$(stat -c %s "$w")" -lt 40000000 ]; then JS="$f"; break 2; fi
            done
          done
          if [ -n "$JS" ]; then
            cp "$JS" "${JS%.js}.wasm" "$GITHUB_WORKSPACE/www/engine/"
            B=$(basename "$JS")
            printf 'window.SFNEW={file:"engine/%s",name:"Stockfish (WASM, NNUE)"};\n' "$B" > "$GITHUB_WORKSPACE/www/engine/config.js"
            echo "USING ENGINE: $B"
          else
            echo "No suitable WASM engine found - the app will use the built-in Stockfish 10"
          fi
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Chess Coach" com.chesscoach.standalone --web-dir www
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          if [ ! -f icon.png ]; then echo "icon.png not found - keeping the default Capacitor icon"; exit 0; fi
          command -v magick >/dev/null || command -v convert >/dev/null || { sudo apt-get update -y && sudo apt-get install -y imagemagick; }
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          # remove the fake checkerboard baked into the icon corners: crop 7% from every side
          $IM icon.png -gravity center -crop 86%x86%+0+0 +repage icon_clean.png
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            g=$((f*74/100))
            $IM icon_clean.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            $IM icon_clean.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            $IM icon_clean.png -resize ${g}x${g} -background none -gravity center -extent ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0c1322</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          find $RES -name 'ic_launcher*' | sort
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Coach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
